<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>开发夹具 · 头部标注</title><link rel="stylesheet" href="./annotations.css">
<style>body{background:#121721;color:#eff4fa;font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;margin:0;padding:30px}main{max-width:960px;margin:auto}h1{font-size:25px;margin:0 0 10px}p{color:#b4bed0;line-height:1.6}.fixture-video{position:relative;aspect-ratio:16/9;overflow:hidden;background:linear-gradient(#273646 56%,#927453 56%,#bd9865);border:1px solid #c1cfdf44;border-radius:20px}.fixture-label{position:absolute;top:16px;left:20px;color:#dce3ef;font-size:13px}.fixture-person{position:absolute;left:40%;top:47%;transform:translate(-50%,0);width:30px;height:90px;border-radius:14px;background:#e6eaf3}.fixture-person:before{content:"";position:absolute;width:25px;height:25px;border-radius:50%;background:#cbb598;left:2px;top:-22px}.fixture-person:after{content:"";position:absolute;left:4px;top:87px;border-left:6px solid #d9dce3;border-right:6px solid #d9dce3;width:11px;height:40px}nav{display:flex;flex-wrap:wrap;gap:12px;margin:20px 0}button{cursor:pointer;border:1px solid #64758c;border-radius:10px;background:#263447;padding:10px 14px;color:white;font:inherit}button[aria-pressed=true]{border-color:#ffe6a8;background:#435060}output{padding:10px;border:1px solid #7587a133;display:block;border-radius:10px;color:#c7d6e9}code{color:#e8c989}</style>
<main><h1>头部标注 · 合成开发夹具</h1><p>此页只有 CSS 人形与手写头顶坐标，用于检验标注组件。不是比赛画面、不是自动跟踪、不是实测数据；不会加入正常观赛页面。</p>
<div class="fixture-video"><span class="fixture-label">SYNTHETIC FIXTURE · 16:9 测试坐标区域</span><span class="fixture-person" aria-hidden="true"></span></div>
<nav><button data-case="valid" aria-pressed="true">有效头点</button><button data-case="occluded">遮挡撤下</button><button data-case="expired">过期撤下</button><button data-case="foot">脚点拒绝</button><button data-case="different">身份不同</button><button data-case="style">修改标签字号</button></nav><output></output><p>正式页面当前没有头部锚点，所以球员头顶不放标注。原素材中的脚点与俯视坐标不会被替代使用。</p></main>
<script type="module">
import {createAnnotationLayer} from './annotations.js';
const surface=document.querySelector('.fixture-video'),out=document.querySelector('output');
const layer=createAnnotationLayer({onSelect:id=>out.textContent=`点击同一身份：${id}（合成编号）`});surface.append(layer.element);
const base={playerId:'FIXTURE-01',mediaId:'fixture',shotId:'shot-1',timeMs:1000,expiresAtMs:1200,landmark:'head-top',coordinateSystem:'video-normalized-top-left',status:'observed',point:{x:.4,y:.43},label:'合成主体'};
function show(kind){const a={...base};let time=1.1,focusId='FIXTURE-01';if(kind==='occluded'){a.status='occluded';a.point=null}if(kind==='expired')time=1.3;if(kind==='foot')a.landmark='foot-contact';if(kind==='different')focusId='FIXTURE-02';layer.setStyle(kind==='style'?{labelSize:20}:{labelSize:15});layer.update({time,anchors:[a],focusId,enabled:true,mediaId:'fixture',shotId:'shot-1',rect:surface.getBoundingClientRect()});out.textContent=`${kind} · 可见标记：${layer.element.dataset.activeCount} · 合成输入，非比赛验收`;document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.case===kind));}document.querySelector('nav').onclick=e=>{if(e.target.dataset.case)show(e.target.dataset.case)};show('valid');
</script></html>
