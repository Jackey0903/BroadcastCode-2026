<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>关键一拍 · BroadcastCode</title><link rel="icon" href="data:,">
<link rel="stylesheet" href="./stage/stage.css"><link rel="stylesheet" href="./court/court.css"><link rel="stylesheet" href="./annotations/annotations.css"><link rel="stylesheet" href="./media/media.css"><link rel="stylesheet" href="./content/content.css"><link rel="stylesheet" href="./dev/inspector.css"></head>
<body><main id="stage" aria-label="关键一拍观赛播放器" tabindex="-1">
<div id="scene"><canvas id="ambience" aria-hidden="true"></canvas><div class="scene-shade"></div><div id="video-surface" data-liquid-dynamic-container><video id="match-video" playsinline preload="auto" crossorigin="anonymous" aria-label="真实比赛原片"></video></div></div>
<div id="annotation-host" data-liquid-ignore></div>
<div id="moment-heading" data-liquid-ignore><div class="moment-pill glass-shell"><div class="glass-target"></div><div class="glass-content"><span id="heading-mascot"></span><span id="moment-kicker">关键一拍</span></div></div><h1 id="moment-title"></h1><p id="moment-subtitle"></p></div>
<nav id="top-tabs" class="glass-shell" aria-label="分析入口"><div class="glass-target"></div><div class="glass-content"><button data-content="moments">关键时刻</button><button id="analysis-button" class="selected" aria-pressed="false">战术分析</button><button data-content="data">球员数据</button></div></nav>
<button id="more-button" class="glass-shell icon-button" aria-label="观看设置" aria-expanded="false"><span class="glass-target"></span><span class="glass-content">•••</span></button>
<aside id="court-shell" class="glass-shell" aria-label="独立球队战术板" inert><div class="glass-target"></div><div id="court-foreground" class="glass-content"></div><button id="court-close" aria-label="收起战术板">×</button></aside>
<div id="controls-host"></div><div id="drawer-host"></div>
<button id="left-edge" class="edge-hotzone" aria-label="打开操作抽屉"></button><button id="right-edge" class="edge-hotzone" aria-label="展开半场战术板"></button>
<div id="settings" data-component="menus" class="glass-shell popover" hidden role="dialog" aria-label="观看设置"><div class="glass-target"></div><div class="glass-content"><h2>观看设置</h2><div class="mode-choices"><button data-mode="immersive">沉浸式</button><button data-mode="fullCourt">全场</button><button data-mode="halfCourt">半场</button></div><label class="setting-row">视频解释图层 <input type="checkbox" id="analysis-toggle" checked></label><button data-content="sources" class="setting-row">数据与素材来源 <span>›</span></button><button data-content="library" class="setting-row">原片与历史成片 <span>›</span></button><button id="style-inspector" class="setting-row" hidden>样式调试 <span>›</span></button><p class="keyboard-hint">空格 播放 · F 全屏 · Esc 返回观看</p></div></div>
<div id="notice" role="status" hidden></div><div id="load-error" hidden><h2>原片暂时无法播放</h2><p>请检查本地素材是否存在。不会用图片代替视频。</p><button id="retry-media">重新加载</button></div>
</main><script src="./vendor/court-viewer.js"></script><script type="module" src="./app.js"></script></body></html>
