<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BroadcastCode · 材质试验室</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0d1118;color:#eef2f8;font:15px system-ui,-apple-system,sans-serif}main{max-width:1440px;margin:auto;padding:40px 28px}h1{font-size:32px;letter-spacing:-1px;margin:0 0 12px}p{color:#a9b4c6;line-height:1.7}header{margin-bottom:26px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;color:inherit;background:#202936;border:1px solid #39475a;border-radius:9px;padding:9px 14px;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid #8bcaff;outline-offset:3px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.card{border:1px solid #293341;border-radius:18px;overflow:hidden;background:#131a24}.info{padding:20px}h2{font-size:19px;margin:0 0 6px}.desc{margin:0;font-size:13px}.scene{height:310px;position:relative;background:#0e131d;isolation:isolate;overflow:hidden}.scene:before{content:'';position:absolute;inset:0;background:var(--scene);background-size:cover;background-position:center}.scene.dark:before{background:#10151e}.scene.color:before{background:radial-gradient(ellipse at 18% 15%,#649cbc,transparent 55%),radial-gradient(ellipse at 88% 70%,#9c5947,transparent 55%),#27384b}.material{background:linear-gradient(155deg,rgb(255 255 255 / var(--shine)),transparent 65%),rgb(var(--tint) / var(--alpha));backdrop-filter:blur(var(--blur)) saturate(var(--sat));-webkit-backdrop-filter:blur(var(--blur)) saturate(var(--sat));border:1px solid rgb(255 255 255 / var(--edge));box-shadow:0 8px 24px rgb(0 0 0 / .14),inset 0 1px rgb(255 255 255 / var(--shine))}.tabs{position:absolute;left:5%;right:5%;top:34px;display:flex;padding:5px;border-radius:28px;gap:3px}.tab{flex:1;text-align:center;border:0;background:transparent;box-shadow:none;border-radius:23px;padding:13px 0;font-size:16px;font-weight:580;color:var(--ink)}.tab.active{background:rgb(255 255 255 / var(--active));box-shadow:inset 0 1px rgb(255 255 255 / var(--shine))}.mini{position:absolute;left:5%;bottom:32px;width:205px;padding:18px;border-radius:18px;color:var(--ink)}.mini b{font-size:17px}.mini p{color:inherit;font-size:12px;margin:7px 0 0;opacity:.8}.play{position:absolute;right:5%;bottom:38px;display:flex;align-items:center;gap:14px;border-radius:24px;padding:13px 18px;color:var(--ink)}.controls{padding:16px 20px;border-top:1px solid #293341;display:grid;grid-template-columns:1fr 1fr;gap:12px 20px}.control{font-size:12px;color:#bdc9d9}.control span{float:right;font-variant-numeric:tabular-nums;color:#fff}input[type=range]{width:100%;accent-color:#a7cfff;margin-top:8px}.footer{padding:0 20px 18px;display:flex;gap:8px;align-items:center}.picked{border-color:#98c9ff}.picked .choose{background:#375577}#result{white-space:pre-wrap;font-size:13px;background:#161f2c;padding:20px;border-radius:12px;color:#d5e8ff}a{color:#b8d8ff}@media(max-width:850px){.grid{grid-template-columns:1fr}main{padding:26px 16px}}
</style>
<main><header><h1>找到你想要的玻璃</h1><p>六种材质，同一尺寸、同一背景。点击页签看选中效果，拖动参数直接比较。先选质感，再应用到观赛页面。</p><div class="toolbar"><select id="background" aria-label="对比背景"><option value="match">真实比赛静帧</option><option value="dark">深色舞台 · 接近你的截图</option><option value="color">彩色背景 · 检查通透度</option></select><button id="reset">恢复六组初始参数</button><button id="export">导出当前选择</button></div><p style="font-size:12px">比赛背景为本机原片第 10 秒静帧；这里没有视频循环、GPU 光学渲染或实时背景复制。参数是候选视觉方案，尚未进行播放性能验收。</p></header><div class="grid" id="grid"></div><p id="selection" aria-live="polite">尚未选择。每组可以独立调整并选定。</p><pre id="result" hidden></pre><p style="font-size:12px">参考：<a href="https://developer.apple.com/design/human-interface-guidelines/materials">Apple 材质指南</a>。以下为网页 CSS 试验，不是原生系统材质复刻。</p></main>
<script>
const presets=[
{name:'01 · 经典轻雾',desc:'偏 iOS 早期的平整毛玻璃，靠模糊融合背景，弱化亮边。',blur:18,alpha:.18,sat:135,edge:.10,shine:.03,active:.14,tint:'18 24 34',ink:'#f3f6fc'},
{name:'02 · 清透薄片',desc:'低模糊、低染色，保留背景轮廓；没有凸起按钮。',blur:8,alpha:.09,sat:120,edge:.16,shine:.045,active:.12,tint:'12 19 30',ink:'#f3f6fc'},
{name:'03 · 柔白磨砂',desc:'浅色乳白材质，深色文字，和深色方案直接对比。',blur:16,alpha:.55,sat:110,edge:.22,shine:.04,active:.42,tint:'239 244 250',ink:'#142132'},
{name:'04 · 烟灰通透',desc:'中性灰，少蓝色染色，轻描边，适合深色舞台。',blur:12,alpha:.28,sat:100,edge:.09,shine:.02,active:.12,tint:'45 49 55',ink:'#f4f5f8'},
{name:'05 · 极简半透明',desc:'完全不模糊，以底色分层；性能优先的对照方案。',blur:0,alpha:.58,sat:100,edge:.07,shine:0,active:.10,tint:'20 27 38',ink:'#f3f6fc'},
{name:'06 · 柔雾深色',desc:'较强柔化、较薄边缘，重在文字可读，避免金属高光。',blur:24,alpha:.30,sat:125,edge:.06,shine:.015,active:.13,tint:'17 23 33',ink:'#f3f6fc'}];
const schema=[['blur','背景模糊',0,32,1,'px'],['alpha','底色透明度',0,.8,.01,''],['sat','饱和度',80,160,1,'%'],['edge','边缘亮度',0,.4,.01,''],['shine','顶部高光',0,.15,.005,''],['active','选中底色',0,.55,.01,'']];let values=presets.map(x=>({...x})),chosen=null;
function apply(card,v){for(const key of ['alpha','edge','shine','active','tint','ink'])card.style.setProperty('--'+key,v[key]);card.style.setProperty('--blur',v.blur+'px');card.style.setProperty('--sat',v.sat+'%');}
function select(i){chosen=i;document.querySelectorAll('.card').forEach((c,j)=>c.classList.toggle('picked',i===j));document.querySelector('#selection').textContent='已选择 '+values[i].name+' · 可以继续调参数';document.querySelector('#result').hidden=false;document.querySelector('#result').textContent=JSON.stringify(values[i],null,2);}
function render(){grid.innerHTML='';values.forEach((v,i)=>{const card=document.createElement('section');card.className='card';card.innerHTML=`<div class="info"><h2>${v.name}</h2><p class="desc">${v.desc}</p></div><div class="scene"><div class="tabs material" role="group" aria-label="${v.name}页签预览"><button class="tab">关键时刻</button><button class="tab active">战术分析</button><button class="tab">球员数据</button></div><div class="mini material"><b>战术分析</b><p>观察持球人与防守距离</p></div><div class="play material"><span>▶</span><span>00:10 ━━━ 00:21</span></div></div><div class="controls"></div><div class="footer"><button class="choose">选择这组参数</button><button class="restore">恢复本组</button></div>`;
for(const [key,label,min,max,step,unit]of schema){const l=document.createElement('label');l.className='control';l.innerHTML=`${label}<span>${v[key]}${unit}</span><input aria-label="${v.name} ${label}" type="range" min="${min}" max="${max}" step="${step}" value="${v[key]}">`;l.querySelector('input').oninput=e=>{v[key]=Number(e.target.value);l.querySelector('span').textContent=v[key]+unit;apply(card,v);if(chosen===i)select(i);};card.querySelector('.controls').append(l);}
card.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{card.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));});card.querySelector('.choose').onclick=()=>select(i);card.querySelector('.restore').onclick=()=>{values[i]={...presets[i]};render();if(chosen!==null)select(chosen);};apply(card,v);grid.append(card);});background();if(chosen!==null)select(chosen);}
function background(){const mode=document.querySelector('#background').value;document.querySelectorAll('.scene').forEach(s=>{s.className='scene '+mode;s.style.setProperty('--scene','url("./match.jpg")');});}
document.querySelector('#background').onchange=background;document.querySelector('#reset').onclick=()=>{values=presets.map(x=>({...x}));render();};document.querySelector('#export').onclick=()=>{if(chosen===null){document.querySelector('#selection').textContent='请先选择一组参数，再导出。';return;}const url=URL.createObjectURL(new Blob([JSON.stringify({version:1,material:values[chosen]},null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='broadcastcode-material.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};render();
</script></html>
