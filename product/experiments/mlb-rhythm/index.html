<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>关键一拍 · 四拍叙事试验</title>
<style>
:root{color-scheme:dark;--bg:#10100e;--ink:#f3f0e8;--muted:#a5a397;--accent:#ff974f;--line:#37372e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Microsoft YaHei",sans-serif}button,a{font:inherit}button{cursor:pointer}header,main,footer{max-width:1440px;margin:auto;padding:24px 40px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}.mark{font-weight:900;letter-spacing:2px}.tag,.eyebrow{font:12px/1.6 monospace;letter-spacing:2px;color:var(--accent)}.intro{display:flex;align-items:end;justify-content:space-between;gap:24px;margin:18px 0 24px}h1{font-size:clamp(28px,3.5vw,48px);line-height:1.15;margin:8px 0}p{margin:0}.muted{color:var(--muted)}.samples{display:flex;gap:8px;flex-wrap:wrap}.samples a{color:var(--muted);text-decoration:none;border:1px solid var(--line);padding:8px 14px;font-size:13px}.samples a.active{color:var(--ink);border-color:var(--accent)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:24px}.screen{background:#000;position:relative;border:1px solid var(--line)}video{width:100%;aspect-ratio:16/9;display:block}.screenbar{display:flex;justify-content:space-between;padding:10px 16px;background:#181814;font-size:12px;color:var(--muted)}.cue{background:#1b1b16;padding:22px 26px;min-height:150px;border:1px solid var(--line);border-top:0}.cue h2{font-size:25px;margin:6px 0 9px}.actions{display:flex;align-items:center;gap:12px;margin-top:20px;flex-wrap:wrap}.primary{background:var(--accent);border:0;color:#16120e;font-weight:bold;padding:12px 22px}.secondary{border:1px solid var(--line);background:transparent;color:var(--ink);padding:10px 16px}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.rail{display:flex;flex-direction:column;gap:10px}.step{background:none;border:1px solid var(--line);padding:16px;text-align:left;color:var(--muted);display:flex;gap:15px}.step.active{border-color:var(--accent);background:#211b14;color:var(--ink)}.step span{font:20px monospace;color:var(--accent)}.step b{display:block;font-size:16px}.step small{display:block;margin-top:3px;font-size:12px}.metric{border:1px solid var(--accent);padding:22px;margin-top:8px;background:#211b14}.metric strong{display:block;font-size:54px;line-height:1.2;letter-spacing:-2px}.metric .bar{height:5px;background:#40392e;margin:16px 0}.metric .fill{height:100%;background:var(--accent);width:44.5%}.metric p{font-size:13px}.metric a{color:var(--accent);font-size:12px}.context{padding:18px;border:1px solid var(--line);font-size:13px;color:var(--muted);margin-top:8px}.context b{color:var(--ink);display:block;margin-bottom:6px}footer{border-top:1px solid var(--line);margin-top:28px;font-size:12px;color:var(--muted)}[hidden]{display:none!important}.status{color:var(--accent);font-size:13px}.error{color:#ffb7a0;margin-top:12px}a{color:var(--accent)}@media(max-width:900px){header,main,footer{padding:20px}.layout{grid-template-columns:1fr}.rail{display:grid;grid-template-columns:1fr 1fr}.metric,.context{grid-column:1/-1}.intro{display:block}.samples{margin-top:16px}.cue{padding:18px}header .tag{display:none}}
.intro h1{font-size:clamp(32px,4.5vw,62px);letter-spacing:-2px}.focus-strip{padding:14px 18px;display:flex;justify-content:space-between;gap:12px;background:#211b14;border-bottom:1px solid var(--line);font-size:14px}.focus-strip span{color:var(--ink)}.focus-strip div{display:flex;gap:12px;align-items:center}.focus-strip b{color:#77756d;font-weight:400}.focus-strip b.active{color:var(--accent)}.focus-strip i{color:#77756d;font-style:normal}.cue h2{font-size:29px}.cue p{max-width:660px}.screenbar{font-size:11px}.context{font-size:12px}.step small{line-height:1.7}@media(max-width:600px){.focus-strip{flex-direction:column}.rail{grid-template-columns:1fr}.cue h2{font-size:24px}}@media(prefers-reduced-motion:no-preference){.focus-strip b{transition:color .25s}.step{transition:background .25s}}</style>
<header><div class="mark">THE HIDDEN PLAY <span style="color:var(--accent)">▸</span></div><span class="tag">四拍叙事 / 本地分支试验</span></header>
<main>
<div class="intro"><div><div class="eyebrow" id="sample-label">加载官方样片…</div><h1>这一球，怎么进的？</h1><p class="muted">先看终结，回看起跳，再读懂这次机会。</p></div><a class="secondary" href="/samples/flagg.mp4" target="_blank" rel="noopener">完整进攻 ↗</a></div>
<div class="layout"><section><div class="screen"><video id="video" controls preload="metadata" playsinline aria-label="比赛原片与聚焦回看"></video><div class="focus-strip" aria-label="动作阅读提示"><span id="focus-note">先看这一记挑篮</span><div><b data-action="0">突破</b><i>→</i><b data-action="1">起跳</b><i>→</i><b data-action="2">终结</b></div></div><div class="screenbar"><span id="mode">第一拍 · 突破到终结</span><span id="clock">原片 0.00 秒</span></div></div>
<div class="cue" aria-live="polite"><div class="eyebrow" id="kind">原片观看</div><h2 id="cue-title">先完整看一次。</h2><p id="cue-text">先感受这次进攻，下一拍再回看出手前的动作。</p><div class="actions"><button class="primary" id="play" disabled>开始观看</button><button class="secondary" id="next" disabled>下一拍 →</button><span class="status" id="status">正在核对样片…</span></div><p class="error" id="error" hidden></p></div></section>
<aside class="rail" aria-label="叙事步骤"><button class="step active" data-stage="0" disabled><span>01</span><div><b>先看进球</b><small>先看突破与挑篮 · 约 2.5 秒</small></div></button><button class="step" data-stage="1" disabled><span>02</span><div><b>这一球怎么完成</b><small>回看起跳 · 约 5 秒</small></div></button><button class="step" data-stage="2" disabled><span>03</span><div><b>这次机会有多大</b><small>一个数字 · 留 4 秒读懂</small></div></button><button class="step" data-stage="3" disabled><span>04</span><div><b>回到这次终结</b><small>恢复原速 · 故事落回画面</small></div></button>
<div class="metric" id="metric" hidden><div class="eyebrow">NBA 官方 / 本次出手</div><strong id="metric-value"></strong><p>预期投篮命中率 · xFG</p><div class="bar"><div class="fill" id="metric-fill"></div></div><p id="metric-context"></p><a id="source" target="_blank" rel="noopener">查看官方原始记录 ↗</a></div>
<div class="context"><b id="event-title">事件核对</b><p id="event-text"></p><p style="margin-top:12px">关键时刻为编辑选定。动作解读依据画面；官方指标依据已核对事件。</p></div></aside></div>
</main><footer>独行侠 · 弗拉格突破挑篮。先看精彩瞬间，再读懂这次机会。<a href="/rendered.mp4" id="export" hidden>连续观看故事版成片 ↗</a></footer>
<script>
const video=document.querySelector('#video'),q=s=>document.querySelector(s);let story,stage=0,token=0,stopAt=null;
const sample='flagg';
const timing={start:15.4,end:17.8,freeze:16.5,split:16.5,hookEnd:17.9,recapEnd:19.5};
const copy=[['先看终结','这一球，怎么进的？','弗拉格突破，起跳，把球送进篮筐。'],['回看动作','回到他起跳的那一刻。','先看突破，再看起跳与挑篮。'],['读懂机会','进了。但这次机会有多大？','官方 xFG：51.0%。这是这次出手条件的模型参考。'],['回到结果','再看一次，这次带着答案。','一次突破挑篮，完成了这次进攻。命中结果与机会大小，是两件事。']];
function error(text){q('#error').hidden=false;q('#error').textContent=text;q('#status').textContent='播放待恢复';}
function updateCue(){const t=video.currentTime;const action=stage===2?1:t<16.1?0:t<16.9?1:2;document.querySelectorAll('[data-action]').forEach(el=>el.classList.toggle('active',Number(el.dataset.action)===action));q('#focus-note').textContent=stage===0?'先看这一记挑篮':stage===1?(t<16.5?'目光跟着持球人':'看起跳，也看正面举起的双臂'):stage===2?'出手快照 · 官方 xFG':'恢复原速，回到命中画面';if(stage===1)q('#cue-text').textContent=t<16.5?'弗拉格向篮筐突破。跟着球，看到他起跳。':'弗拉格起跳挑篮，正面防守人双臂举起。';q('#clock').textContent=`原片 ${t.toFixed(2)} 秒`;}
async function seek(t){if(video.readyState===0)await new Promise(resolve=>video.addEventListener('loadedmetadata',resolve,{once:true}));if(Math.abs(video.currentTime-t)<.01)return;await new Promise(resolve=>{video.addEventListener('seeked',resolve,{once:true});video.currentTime=t;});}
async function setStage(index,autoplay=false){if(!story)return;const mine=++token;stage=index;stopAt=null;video.pause();video.playbackRate=1;video.muted=index!==0;q('#error').hidden=true;document.querySelectorAll('[data-stage]').forEach(b=>{const active=Number(b.dataset.stage)===stage;b.classList.toggle('active',active);b.setAttribute('aria-current',active?'step':'false');});const c=copy[index];q('#kind').textContent=c[0];q('#cue-title').textContent=c[1];q('#cue-text').textContent=c[2];q('#metric').hidden=index<2;q('#mode').textContent=['第一拍 · 突破到终结','第二拍 · 聚焦慢放','第三拍 · 出手快照','第四拍 · 动作与结果'][index];q('#next').disabled=index===3;q('#next').textContent=index===0?'这一球怎么完成 →':index===1?'揭示官方数据 →':'解释这个指标 →';q('#play').textContent=index===0?'先看这次终结':index===1?'重看关键动作':index===2?'回看出手动作':'重看动作与结果';q('#status').textContent=index===1?`'0.5× 慢放 · 编辑窗口'`:index===2?'对应单次出手 · 官方数值':index===3?'恢复原速 · 将动作与结果连起来':'原速 · 数据稍后揭示';await seek(index===0?timing.start:index===1||index===3?timing.start:timing.freeze);if(mine!==token)return;if(index===0)stopAt=timing.hookEnd;if(index===1){video.playbackRate=.5;stopAt=timing.end;}if(index===3)stopAt=timing.recapEnd;if(autoplay){try{await video.play();}catch(e){error('浏览器暂停了自动播放，请点击播放按钮。');}}updateCue();}
video.addEventListener('timeupdate',()=>{updateCue();if(stopAt!==null&&video.currentTime>=stopAt){video.pause();stopAt=null;q('#status').textContent=stage===3?'故事回看完成 · 可重新观看':stage===0?'看完终结 · 回到起跳之前':'看清动作了 · 再看这次机会';}});video.addEventListener('ended',()=>{if(stage===0)q('#status').textContent='完整回合看完了 · 进入第二拍';});video.addEventListener('error',()=>error('原片未能加载。请核对本地媒体与预览服务。'));q('#play').onclick=()=>setStage(stage===2?1:stage,true);q('#next').onclick=()=>setStage(Math.min(3,stage+1),stage===0||stage===2);document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>setStage(Number(b.dataset.stage),[1,3].includes(Number(b.dataset.stage))));
(async()=>{try{const response=await fetch('/stories.json');if(!response.ok)throw Error('无法读取样片记录');const manifest=await response.json();story=manifest.stories.find(s=>s.sample===sample);if(!story?.officialEvent?.verified||story.shotMetric?.rawValue!==story.officialEvent.expectedFg)throw Error('官方指标尚未核准');q('#sample-label').textContent='独行侠进攻 / 库珀·弗拉格';q('#metric-value').textContent=story.shotMetric.display;q('#metric-fill').style.width=`${story.shotMetric.rawValue*100}%`;q('#metric-context').textContent=`${story.player.name} · 本次${story.officialEvent.shotValue}分出手 · 实际命中`;q('#source').href=story.shotMetric.sourceUrl;q('#event-text').textContent=story.officialEvent.description;q('#event-title').textContent=`已匹配官方事件 ${story.officialEvent.eventId}`;video.src=`/samples/${sample}.mp4`;document.querySelectorAll('button').forEach(b=>b.disabled=false);await setStage(0);const rendered=await fetch(`/rendered-${sample}.mp4`,{method:'HEAD'});if(rendered.ok){q('#export').href=`/rendered-${sample}.mp4`;q('#export').hidden=false;}}catch(e){error(e.message);}})();
</script></html>
