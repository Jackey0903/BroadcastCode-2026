<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>独行侠 · 一整个回合，一步步看懂</title>
<style>:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#11120f;color:#f3f0e8;font:16px/1.7 "Microsoft YaHei",sans-serif}main{max-width:1280px;padding:30px;margin:auto}a{color:#ff974f}h1{font-size:clamp(30px,4vw,52px);margin:14px 0}p{color:#a6a79b}button{font:inherit;cursor:pointer;background:#242a20;color:#f3f0e8;border:1px solid #42493a;padding:8px 15px}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid #ff974f;outline-offset:4px}button:disabled{opacity:.4}.eyebrow{font-size:12px;letter-spacing:2px;color:#ff974f}.picture{position:relative;aspect-ratio:16/9;background:#000}video,img,svg{width:100%;height:100%;position:absolute;inset:0;object-fit:contain}svg{pointer-events:none}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}details{border-top:1px solid #42493a;padding:20px 0;margin-top:25px}summary{cursor:pointer}.players{display:grid;grid-template-columns:1fr 1fr;gap:20px}.card{border:1px solid #42493a;padding:22px}.fine{font-size:12px}input[type=range]{width:100%;accent-color:#ff974f}#status{color:#ff974f}#error{color:#ffb7a0}[hidden]{display:none!important}@media(max-width:650px){main{padding:18px}.players{grid-template-columns:1fr}button{font-size:13px}}</style>
<main><div class="eyebrow">THE HIDDEN PLAY ▸ 独行侠 / 弗拉格</div><h1>这一球，怎么进的？</h1><p>先看终结，短暂回溯，再从推进到挑篮讲完整个进攻回合。</p>
<div class="picture"><video id="video" controls playsinline preload="metadata" aria-label="比赛与同步画面解读"></video><img id="frame" alt="原片逐帧观察" hidden><svg id="overlay" viewBox="0 0 960 540" aria-label="编辑选定的画面标注" hidden></svg></div>
<div class="actions"><button id="story">播放完整解读</button><button id="reverse">↶ 慢速倒放</button><a href="/samples/flagg.mp4" target="_blank" rel="noopener">完整原片 ↗</a></div><p id="status" role="status">正在准备…</p><p id="error" role="alert" hidden></p>
<details><summary>逐帧查看与关键画面</summary><div class="actions"><button id="prev" disabled>◀ 上一帧</button><button id="next" disabled>下一帧 ▶</button><button data-frame="6">右侧配合</button><button data-frame="12">队友向篮下移动</button><button data-frame="14">伊森防守</button><button data-frame="16.5">起跳与举臂</button></div><input id="slider" type="range" min="0" max="1290" value="989" step="1" disabled aria-label="原片帧编号"><p id="counter" class="fine"></p><p class="fine">逐帧图来自原视频解码。光圈和引线提示观察位置。</p></details>
<h2>身前的防守，与篮下的防守。</h2><div id="players" class="players"></div>
<details><summary>换一个人，会难在哪里？</summary><p>控球不稳时，球可能更容易进入防守者伸手可触及的位置；出手点更低或收球出手更慢时，也可能更容易受到举臂防守干扰。</p><p id="limit"></p><p id="coverage"></p></details>
<p class="fine">身体尺寸附官方来源。<a href="/data-plan.md" target="_blank">查看后续数据与实现规划 ↗</a></p></main>
<script>
const q=s=>document.querySelector(s),v=q('#video');let plan,n=989,epoch=0,ready=false;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
function fail(s){q('#error').hidden=false;q('#error').textContent=s;}
async function play(url){epoch++;q('#frame').hidden=true;q('#overlay').hidden=true;v.hidden=false;q('#error').hidden=true;v.src=url;v.load();try{await v.play();q('#status').textContent=url==='/reverse.mp4'?'0.65× 倒放 · 回到起跳之前':'完整回合解读 · 标注与比赛同步';}catch(e){fail('媒体尚未生成或播放被暂停，请运行渲染后点击播放。');}}
function marks(){const t=n/plan.fps,p=plan.segments.find(s=>s.annotations&&Math.abs(s.start-t)<=1/plan.fps);q('#overlay').innerHTML=(p?.annotations||[]).map(a=>{const c=a.color||'#ff974f',arr=a.arrow;return `${a.rx?`<ellipse cx="${a.x}" cy="${a.y}" rx="${a.rx}" ry="${a.ry}" fill="${c}" fill-opacity=".09" stroke="${c}" stroke-width="3"/>`:''}${arr?`<line x1="${arr[0]}" y1="${arr[1]}" x2="${arr[2]}" y2="${arr[3]}" stroke="${c}" stroke-width="3"/><circle cx="${arr[2]}" cy="${arr[3]}" r="4" fill="${c}"/>`:''}<rect x="${a.lx}" y="${a.ly}" width="${Math.min(350,a.label.length*17+20)}" height="32" fill="#0a1711" fill-opacity=".94" stroke="${c}"/><text x="${a.lx+9}" y="${a.ly+23}" font-size="17" fill="${c}" font-family="Microsoft YaHei,sans-serif">${esc(a.label)}</text>`;}).join('');q('#overlay').hidden=false;}
async function inspect(index){if(!ready)return;const mine=++epoch;n=Math.max(0,Math.min(plan.sourceFrameCount-1,index));v.pause();const im=new Image();im.src=`/frames/frame-${String(n).padStart(4,'0')}.jpg`;try{await im.decode();if(mine!==epoch)return;q('#frame').src=im.src;q('#frame').hidden=false;v.hidden=true;marks();q('#slider').value=n;q('#counter').textContent=`原片第 ${n+1} / ${plan.sourceFrameCount} 帧 · ${(n/plan.fps).toFixed(3)} 秒`;q('#status').textContent='逐帧观察 · 可点击播放完整解读返回故事';}catch(e){if(mine===epoch)fail('该原片帧未生成，请先运行渲染。');}}
q('#story').onclick=()=>play('/rendered-flagg.mp4');q('#reverse').onclick=()=>play('/reverse.mp4');q('#prev').onclick=()=>inspect(n-1);q('#next').onclick=()=>inspect(n+1);q('#slider').oninput=e=>inspect(Number(e.target.value));document.querySelectorAll('[data-frame]').forEach(b=>b.onclick=()=>inspect(Math.round(Number(b.dataset.frame)*plan.fps)));
(async()=>{try{const r=await fetch('/story-plan.json');if(!r.ok)throw Error('无法读取解读计划');plan=await r.json();q('#players').innerHTML=plan.players.map((p,i)=>`<article class="card"><div class="eyebrow">${esc(p.role)}</div><h3>${esc(p.name)} #${p.jersey}</h3><p>身高 ${esc(p.height)}<br>臂展 ${esc(p.wingspan||'资料待补充')}</p><a href="${p.heightSource}" target="_blank" rel="noopener">身高来源 ↗</a>${p.wingspanSource?` · <a href="${p.wingspanSource}" target="_blank" rel="noopener">臂展来源 ↗</a>`:''}</article>`).join('');q('#limit').textContent=plan.difficulty.limit;q('#coverage').textContent=plan.difficulty.coverage;const f=await fetch('/frames/frame-0000.jpg',{method:'HEAD'});ready=f.ok;q('#prev').disabled=q('#next').disabled=q('#slider').disabled=!ready;q('#counter').textContent=ready?'原片59.94 fps · 可逐帧查看':'运行本地渲染后可逐帧查看';v.src='/rendered-flagg.mp4';const media=await fetch(v.src,{method:'HEAD'});q('#status').textContent=media.ok?'完整解读已就绪 · 约39秒':'请先按README渲染本地成片';}catch(e){fail(e.message);}})();
</script></html>
